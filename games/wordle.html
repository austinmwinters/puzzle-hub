<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Wordle · Puzzle Hub</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="game">
    <p class="subline" id="sub"></p>
    <div class="board" id="board"></div>
    <div class="toolbar" id="after"></div>
    <div id="kb"></div>
  </main>
  <script src="../js/common.js"></script>
  <script src="../js/words.js"></script>
  <script src="../js/wordgame.js"></script>
  <script>
    const GAME = 'wordle', MAX = 6;
    const help = () => PZ.showModal('How to play', `
      <p>Guess the five-letter word in six tries. After each guess the tiles change colour:</p>
      <ul><li><b style="color:var(--correct)">Green</b>: right letter, right spot.</li>
      <li><b style="color:var(--present)">Gold</b>: in the word, wrong spot.</li>
      <li><b>Grey</b>: not in the word.</li></ul>
      <p>Daily puzzles are the same for everyone each day. Practice gives a fresh word whenever you want one.</p>`);
    PZ.header(GAME, { onHelp: help });

    const today = PZ.todayKey();
    let answer, guesses, current = '', over = false, revealing = -1;

    function score(guess, target) {
      const res = Array(5).fill('absent'), left = {};
      for (let i = 0; i < 5; i++) {
        if (guess[i] === target[i]) res[i] = 'correct';
        else left[target[i]] = (left[target[i]] || 0) + 1;
      }
      for (let i = 0; i < 5; i++) {
        if (res[i] !== 'correct' && left[guess[i]]) { res[i] = 'present'; left[guess[i]]--; }
      }
      return res;
    }

    const boardEl = document.getElementById('board');
    const rows = [...Array(MAX)].map(() => {
      const r = PZ.el('div', { class: 'row' }, [...Array(5)].map(() => PZ.el('div', { class: 'tile' })));
      boardEl.append(r);
      return r;
    });
    const kb = WG.keyboard(onKey);
    document.getElementById('kb').append(kb.node);

    function render() {
      const rank = { absent: 1, present: 2, correct: 3 }, keyState = {};
      rows.forEach((row, i) => {
        const word = i < guesses.length ? guesses[i] : i === guesses.length ? current : '';
        // The row being revealed gets its colours from reveal(), tile by tile.
        const marks = i < guesses.length && i !== revealing ? score(guesses[i], answer) : null;
        [...row.children].forEach((tile, j) => {
          tile.textContent = word[j] || '';
          tile.className = 'tile' + (word[j] ? ' filled' : '') + (marks ? ` ${marks[j]}` : '');
          if (marks && (rank[marks[j]] > (rank[keyState[word[j]]] || 0))) keyState[word[j]] = marks[j];
        });
      });
      for (const [k, b] of Object.entries(kb.keys)) b.className = b.className.replace(/ (correct|present|absent)/g, '') + (keyState[k] ? ` ${keyState[k]}` : '');
    }

    function persist() {
      if (!PZ.isPractice) PZ.saveDailyState(GAME, today, { guesses });
    }

    function shareText() {
      const won = guesses[guesses.length - 1] === answer;
      const grid = guesses.map((g) => score(g, answer).map((m) => ({ correct: '🟩', present: '🟨', absent: '⬜' })[m]).join('')).join('\n');
      return `Wordle ${PZ.isPractice ? '(practice)' : today} ${won ? guesses.length : 'X'}/${MAX}\n${grid}`;
    }

    function finish(animate) {
      over = true;
      const won = guesses[guesses.length - 1] === answer;
      if (!PZ.isPractice) PZ.recordDaily(GAME, today, won, won ? guesses.length : null);
      if (won && animate) { rows[guesses.length - 1].classList.add('win'); PZ.confetti(); }
      const after = document.getElementById('after');
      after.replaceChildren(
        PZ.el('span', { class: `done-banner${won ? '' : ' lost'}` }, won ? `Solved in ${guesses.length}` : `The word was ${answer.toUpperCase()}`),
        PZ.el('button', { class: 'btn', onclick: () => WG.copy(shareText()) }, 'Copy result'),
        PZ.isPractice ? PZ.el('button', { class: 'btn primary', onclick: newGame }, 'New word') : '');
      if (animate) setTimeout(() => PZ.showModal(won ? 'Solved!' : 'Out of guesses',
        PZ.el('div', {}, PZ.el('p', {}, won ? `You got it in ${guesses.length}.` : `The word was ${answer.toUpperCase()}.`),
          PZ.isPractice ? null : PZ.statsPanel(GAME))), won ? 1100 : 400);
    }

    // Flip each tile of the newest row in turn, colouring it at the half-way point.
    function reveal(i) {
      revealing = i;
      render();
      const marks = score(guesses[i], answer), tiles = [...rows[i].children], STEP = 260;
      tiles.forEach((t, j) => {
        setTimeout(() => t.classList.add('flip'), j * STEP);
        setTimeout(() => t.classList.add(marks[j]), j * STEP + 250);
      });
      return new Promise((done) => setTimeout(() => { revealing = -1; render(); done(); }, 4 * STEP + 520));
    }

    function onKey(k) {
      if (over || revealing >= 0) return;
      if (k === 'back') current = current.slice(0, -1);
      else if (k === 'enter') {
        if (current.length < 5) return reject('Not enough letters');
        if (!WG.isWord(current)) return reject('Not in word list');
        guesses.push(current);
        current = '';
        persist();
        reveal(guesses.length - 1).then(() => {
          if (guesses[guesses.length - 1] === answer || guesses.length === MAX) finish(true);
        });
        return;
      } else if (current.length < 5) current += k;
      render();
    }
    function reject(msg) {
      PZ.toast(msg);
      const row = rows[guesses.length];
      row.classList.remove('shake');
      void row.offsetWidth;
      row.classList.add('shake');
    }

    function newGame() {
      answer = WG.randomAnswer();
      guesses = [];
      current = '';
      over = false;
      rows.forEach((r) => r.classList.remove('win'));
      document.getElementById('after').replaceChildren();
      render();
    }

    if (PZ.isPractice) {
      document.getElementById('sub').textContent = 'Practice: unlimited words, no effect on stats';
      newGame();
    } else {
      document.getElementById('sub').textContent = `Daily · ${PZ.prettyDate(today)}`;
      answer = WG.dailyAnswer(GAME, today);
      guesses = PZ.dailyState(GAME, today)?.guesses || [];
      render();
      if (guesses.length && (guesses[guesses.length - 1] === answer || guesses.length === MAX)) finish(false);
      else if (!PZ.getStats(GAME).played) help();
    }
  </script>
</body>
</html>
