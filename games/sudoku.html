<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Sudoku · Puzzle Hub</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .sgrid { display: grid; grid-template-columns: repeat(9, 1fr); width: min(100%, 468px); aspect-ratio: 1; border: 3px solid var(--text); border-radius: 16px; overflow: hidden; background: var(--surface); user-select: none; box-shadow: var(--shadow); }
    .sc { border: 1px solid var(--border); display: grid; place-items: center; font-size: clamp(1.1rem, 5.5vw, 1.7rem); cursor: pointer; position: relative; color: var(--accent); font-weight: 600; }
    .sc.given { color: var(--text); font-weight: 700; }
    .sc:nth-child(9n+3), .sc:nth-child(9n+6) { border-right: 2px solid var(--text); }
    .sc:nth-child(n+19):nth-child(-n+27), .sc:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid var(--text); }
    .sc.peer { background: var(--surface-2); }
    .sc.same { background: var(--cell-shade); }
    .sc.sel { background: var(--game); color: #fff; }
    .sc.bad { color: var(--danger); }
    .sc.sel.bad { color: #fff; text-decoration: underline; }
    .notes { position: absolute; inset: 1px; display: grid; grid-template-columns: repeat(3, 1fr); font-size: clamp(.5rem, 2.2vw, .7rem); color: var(--muted); font-weight: 500; }
    .notes span { display: grid; place-items: center; }
    .sc.sel .notes { color: var(--accent-text); }
    .pad { display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; width: min(100%, 468px); }
    .pad button { height: 50px; font-size: 1.35rem; font-weight: 900; border-radius: 12px; border: 0; background: var(--surface); color: var(--game); cursor: pointer; box-shadow: 0 3px 0 var(--raise); }
    .pad button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--raise); }
    .pad button.spent { opacity: .3; }
  </style>
</head>
<body>
  <main class="game">
    <p class="subline" id="sub"></p>
    <div class="toolbar">
      <span class="timer" id="timer">0:00</span>
      <select class="btn" id="diff" hidden aria-label="Difficulty">
        <option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option>
      </select>
      <button class="btn" id="newBtn" hidden>New puzzle</button>
    </div>
    <div class="sgrid" id="grid"></div>
    <div class="pad" id="pad"></div>
    <div class="toolbar">
      <button class="btn" id="notesBtn">✎ Notes</button>
      <button class="btn" id="eraseBtn">Erase</button>
      <button class="btn" id="undoBtn">Undo</button>
    </div>
    <div class="toolbar" id="after"></div>
  </main>
  <script src="../js/common.js"></script>
  <script>
    const GAME = 'sudoku';
    const help = () => PZ.showModal('How to play', `
      <p>Fill every empty square so each row, column and 3×3 box contains the digits 1–9 exactly once.</p>
      <ul><li>Tap a square, then a number (or type it).</li>
      <li><b>Notes</b> mode toggles small pencil marks.</li>
      <li>Numbers that clash with another in the same row, column or box turn red.</li>
      <li>Arrow keys move, Backspace erases, N toggles notes.</li></ul>
      <p>Every puzzle has exactly one solution.</p>`);
    PZ.header(GAME, { onHelp: help });

    // ---------- generator ----------
    const ROW = (i) => Math.floor(i / 9), COL = (i) => i % 9, BOX = (i) => Math.floor(ROW(i) / 3) * 3 + Math.floor(COL(i) / 3);
    const PEERS = [...Array(81)].map((_, i) => [...Array(81).keys()].filter((j) => j !== i && (ROW(j) === ROW(i) || COL(j) === COL(i) || BOX(j) === BOX(i))));

    // Counts solutions up to `limit` (bitmask backtracking, most-constrained cell first).
    function countSolutions(cells, limit = 2, rand = null) {
      const g = cells.slice();
      let count = 0, solution = null;
      const cand = (i) => { let m = 0x3fe; for (const p of PEERS[i]) m &= ~(1 << g[p]); return m; };
      (function solve() {
        let best = -1, bestMask = 0, bestN = 10;
        for (let i = 0; i < 81; i++) {
          if (g[i]) continue;
          const m = cand(i);
          let n = 0; for (let b = m; b; b &= b - 1) n++;
          if (n < bestN) { best = i; bestMask = m; bestN = n; if (n <= 1) break; }
        }
        if (best === -1) { count++; solution = solution || g.slice(); return; }
        const digits = [];
        for (let d = 1; d <= 9; d++) if (bestMask & (1 << d)) digits.push(d);
        if (rand) rand.shuffle(digits);
        for (const d of digits) {
          g[best] = d;
          solve();
          if (count >= limit) return;
        }
        g[best] = 0;
      })();
      return { count, solution };
    }

    const CLUES = { easy: 40, medium: 32, hard: 25 };
    function generate(rand, difficulty) {
      const full = countSolutions(Array(81).fill(0), 1, rand).solution;
      const puzzle = full.slice();
      for (const i of rand.shuffle([...Array(81).keys()])) {
        if (puzzle.filter(Boolean).length <= CLUES[difficulty]) break;
        const keep = puzzle[i];
        puzzle[i] = 0;
        if (countSolutions(puzzle).count !== 1) puzzle[i] = keep;
      }
      return { puzzle, solution: full };
    }

    // ---------- state & UI ----------
    const today = PZ.todayKey();
    const gridEl = document.getElementById('grid'), padEl = document.getElementById('pad');
    const timer = PZ.stopwatch(document.getElementById('timer'));
    let puzzle, solution, values, notes, history, sel = -1, notesMode = false, over = false, clock;

    const cells = [...Array(81)].map((_, i) => {
      const c = PZ.el('div', { class: 'sc', onclick: () => { sel = i; render(); } });
      gridEl.append(c);
      return c;
    });
    for (let d = 1; d <= 9; d++) padEl.append(PZ.el('button', { onclick: () => input(d) }, String(d)));

    function persist() {
      if (!PZ.isPractice && !over) PZ.saveDailyState(GAME, today, { values, notes, elapsed: timer.seconds });
    }

    function render() {
      const conflict = (i) => values[i] && PEERS[i].some((p) => values[p] === values[i]);
      cells.forEach((c, i) => {
        const v = values[i];
        const peer = sel >= 0 && PEERS[sel].includes(i);
        const same = sel >= 0 && values[sel] && v === values[sel];
        c.className = 'sc' + (puzzle[i] ? ' given' : '') + (i === sel ? ' sel' : same ? ' same' : peer ? ' peer' : '') + (conflict(i) && !puzzle[i] ? ' bad' : '');
        if (v) c.textContent = v;
        else if (notes[i].length) c.replaceChildren(PZ.el('div', { class: 'notes' }, [...Array(9)].map((_, k) => PZ.el('span', {}, notes[i].includes(k + 1) ? String(k + 1) : ''))));
        else c.textContent = '';
      });
      const counts = Array(10).fill(0);
      values.forEach((v) => counts[v]++);
      [...padEl.children].forEach((b, k) => b.classList.toggle('spent', counts[k + 1] >= 9));
      document.getElementById('notesBtn').classList.toggle('on', notesMode);
    }

    function input(d) {
      if (over || sel < 0 || puzzle[sel]) return;
      history.push({ i: sel, v: values[sel], n: notes[sel].slice() });
      if (notesMode && d) {
        if (values[sel]) return render();
        notes[sel] = notes[sel].includes(d) ? notes[sel].filter((x) => x !== d) : [...notes[sel], d].sort();
      } else {
        values[sel] = values[sel] === d ? 0 : d;
        notes[sel] = [];
        // Placing a digit clears that digit from peer notes.
        if (d) for (const p of PEERS[sel]) notes[p] = notes[p].filter((x) => x !== d);
      }
      timer.start();
      render();
      persist();
      if (values.every((v, i) => v === solution[i])) finish(true);
    }
    const erase = () => { if (sel >= 0 && !puzzle[sel]) { history.push({ i: sel, v: values[sel], n: notes[sel].slice() }); values[sel] = 0; notes[sel] = []; render(); persist(); } };
    function undo() {
      const h = history.pop();
      if (!h || over) return;
      values[h.i] = h.v; notes[h.i] = h.n; sel = h.i;
      render(); persist();
    }

    document.getElementById('notesBtn').onclick = () => { notesMode = !notesMode; render(); };
    document.getElementById('eraseBtn').onclick = erase;
    document.getElementById('undoBtn').onclick = undo;
    document.addEventListener('keydown', (e) => {
      if (document.querySelector('.modal-backdrop') || e.metaKey || e.ctrlKey) return;
      const moves = { ArrowUp: -9, ArrowDown: 9, ArrowLeft: -1, ArrowRight: 1 };
      if (moves[e.key] != null) { sel = sel < 0 ? 0 : (sel + moves[e.key] + 81) % 81; render(); e.preventDefault(); }
      else if (/^[1-9]$/.test(e.key)) input(Number(e.key));
      else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') erase();
      else if (e.key.toLowerCase() === 'n') { notesMode = !notesMode; render(); }
      else if (e.key.toLowerCase() === 'z') undo();
    });

    function finish(fresh) {
      over = true;
      timer.stop();
      sel = -1;
      render();
      if (!PZ.isPractice && fresh) PZ.recordDaily(GAME, today, true, timer.seconds);
      if (!PZ.isPractice) PZ.saveDailyState(GAME, today, { values, notes, elapsed: timer.seconds, done: true });
      document.getElementById('after').replaceChildren(PZ.el('span', { class: 'done-banner' }, `Solved in ${PZ.formatTime(timer.seconds)}`));
      if (fresh) PZ.confetti();
      if (fresh && !PZ.isPractice) setTimeout(() => PZ.showModal('Solved!', PZ.statsPanel(GAME)), 900);
    }

    function start(gen, saved) {
      ({ puzzle, solution } = gen);
      values = saved?.values || puzzle.slice();
      notes = saved?.notes || [...Array(81)].map(() => []);
      history = []; sel = -1; over = false;
      timer.reset();
      document.getElementById('after').replaceChildren();
      if (saved?.elapsed) timer.set(saved.elapsed);
      render();
    }

    if (PZ.isPractice) {
      document.getElementById('sub').textContent = 'Practice: endless puzzles, no effect on stats';
      const diff = document.getElementById('diff'), btn = document.getElementById('newBtn');
      diff.hidden = btn.hidden = false;
      diff.value = PZ.load('sudoku:diff', 'medium');
      const fresh = () => { PZ.save('sudoku:diff', diff.value); start(generate(PZ.rng(Math.random() * 2 ** 32), diff.value)); };
      btn.onclick = fresh;
      diff.onchange = fresh;
      fresh();
    } else {
      document.getElementById('sub').textContent = `Daily · Medium · ${PZ.prettyDate(today)}`;
      const saved = PZ.dailyState(GAME, today);
      start(generate(PZ.rng(PZ.hash(`${GAME}-${today}`)), 'medium'), saved);
      if (saved?.done) finish(false);
      else if (!PZ.getStats(GAME).played && !saved) help();
    }
    window.addEventListener('pagehide', persist);
  </script>
</body>
</html>
