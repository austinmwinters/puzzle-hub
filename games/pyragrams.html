<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Pyragrams · Puzzle Hub</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/pyra.css">
</head>
<body>
  <main class="game"></main>
  <script src="../js/common.js"></script>
  <script src="../js/phrases.js"></script>
  <script src="../js/pyramid.js"></script>
  <script src="../js/pyragame.js"></script>
  <script>
    PyraWords({
      id: 'pyragrams',
      graph: PYR.phraseGraph(window.PHRASES),
      downward: true,
      help: () => PZ.showModal('How to play', `
        <p>Rearrange the pyramid so every linked pair makes a common phrase or compound word, reading <b>downward</b>: the upper word comes first. <b>card</b> above <b>game</b> works (card game); <b>game</b> above <b>card</b> doesn't.</p>
        <ul><li>Drag a word onto another to swap them, or tap one and then the other.</li>
        <li>Tap a line to mark a link you're confident about (it turns gold). Gold links tie their pieces into a chain: drag any piece and the whole chain moves with it, keeping its shape.</li>
        <li>Press <b>Check</b> to test your pyramid. Links in exactly the right place turn <b style="color:var(--correct)">green</b>; everything else breaks apart. Green links joined to the top word lock in place.</li>
        <li>You get 4 checks. There's only one arrangement where every link works.</li></ul>`),
    });
  </script>
</body>
</html>
